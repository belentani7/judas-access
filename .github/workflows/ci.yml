name: JUDAS Access / narrative and privacy gates

on:
  push:
    branches: [main, "fix/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: judas-access-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Privacy tests / TypeScript / immersive build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Privacy and original scene regression
        run: pnpm run test
      - name: Typecheck
        run: pnpm run typecheck
      - name: Production build
        run: pnpm run build
      - name: Verify static entrypoint
        run: test -s dist/index.html
