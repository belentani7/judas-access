name: JUDAS Access / narrative and privacy gates
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Privacy tests / Typescript / Immersive build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Privacy and original scene regression
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify static entrypoint
        run: test -s dist/index.html
