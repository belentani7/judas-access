# Build the Vite static bundle for optional GitHub Pages hosting.
# Vercel remains the primary configured deployment target.
name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install from the tracked lockfile
        run: pnpm install --frozen-lockfile
      - name: Build Vite for Pages subpath
        run: pnpm exec vite build --base=./ --outDir=dist --emptyOutDir
      - name: Verify SPA artifact and fallback
        run: |
          test -s dist/index.html
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && vars.ENABLE_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
